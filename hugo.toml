baseURL = "https://plantmolgenlab.kz/"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  # Адрес приложения на сервере лаборатории
  appURL = "https://croppopstructure.plantmolgenlab.kz"
  # Почта для связи. Когда заведёте почту на домене, замените, например, на info@plantmolgenlab.kz
  email = "ipbbkz@gmail.com"
  phone = "+7 (727) 394-80-06"
  researchgate = "https://www.researchgate.net/lab/Yerlan-Turuspekov-Lab"
  kazflora = "https://kazflora.kz"

[markup.goldmark.renderer]
  unsafe = true   # нужно, чтобы текст из визуального редактора Pages CMS отображался корректно

# ───────────── Русский (основной) ─────────────
[languages.ru]
  contentDir = "content/ru"
  weight = 1
  label = "Рус"
  locale = "ru"
  title = "Лаборатория молекулярной генетики"
  [languages.ru.params]
    institute = "Институт биологии и биотехнологии растений"
    address = "ул. Тимирязева, 45, Алматы 050040, Казахстан"
    description = "Лаборатория молекулярной генетики ИББР: геномная селекция культур Казахстана и ДНК-генотипирование дикой флоры."
  [[languages.ru.menus.main]]
    name = "Исследования"
    pageRef = "/research"
    weight = 10
  [[languages.ru.menus.main]]
    name = "Команда"
    pageRef = "/team"
    weight = 20
  [[languages.ru.menus.main]]
    name = "Публикации"
    pageRef = "/publications"
    weight = 30
  [[languages.ru.menus.main]]
    name = "Проекты"
    pageRef = "/projects"
    weight = 40
  [[languages.ru.menus.main]]
    name = "Контакты"
    pageRef = "/contact"
    weight = 50
  [[languages.ru.menus.main]]
    name = "CropPopStructure"
    pageRef = "/tools"
    weight = 60
    [languages.ru.menus.main.params]
      class = "nav-app"

