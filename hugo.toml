baseURL = "https://plantmolgenlab.kz/"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  # Адрес приложения на сервере лаборатории
  appURL = "https://croppopstructure.plantmolgenlab.kz"
  email = "info@plantmolgenlab.kz"
  github = ""

[markup.goldmark.renderer]
  unsafe = true   # нужно, чтобы текст из визуального редактора Pages CMS отображался корректно

# ───────────── Русский (основной) ─────────────
[languages.ru]
  contentDir = "content/ru"
  weight = 1
  label = "Рус"
  locale = "ru"
  title = "Лаборатория молекулярной генетики растений"
  [languages.ru.params]
    shortTitle = "PlantMolGen Lab"
    institute = "Институт биологии и биотехнологии растений"
    address = "Алматы, Казахстан"   # впишите полный адрес
    description = "Лаборатория молекулярной генетики растений: популяционная геномика злаков, GWAS и филогеномика растений."
  [[languages.ru.menus.main]]
    name = "Исследования"
    pageRef = "/research"
    weight = 10
  [[languages.ru.menus.main]]
    name = "Команда"
    pageRef = "/team"
    weight = 20
  [[languages.ru.menus.main]]
    name = "Публикации"
    pageRef = "/publications"
    weight = 30
  [[languages.ru.menus.main]]
    name = "Новости"
    pageRef = "/news"
    weight = 40
  [[languages.ru.menus.main]]
    name = "Контакты"
    pageRef = "/contact"
    weight = 50
  [[languages.ru.menus.main]]
    name = "CropPopStructure"
    pageRef = "/tools"
    weight = 60
    [languages.ru.menus.main.params]
      class = "nav-app"

