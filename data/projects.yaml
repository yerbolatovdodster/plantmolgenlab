- kind: program
  years: 2024–2026
  code: BR24992903
  lead: Туруспеков Е.К.
  url: https://ipbb.tilda.ws/
  title_ru: Практическое внедрение современных молекулярно-генетических, физиолого-биохимических, биотехнологических методов и цифрового фенотипирования в селекцию экономически значимых сельскохозяйственных культур
  title_kk: Экономикалық маңызды ауыл шаруашылығы дақылдарының селекциясына заманауи молекулалық-генетикалық, физиологиялық-биохимиялық, биотехнологиялық әдістер мен цифрлық фенотиптеуді практикалық енгізу
  title_en: Practical implementation of modern molecular genetic, physiological, biochemical and biotechnological methods and digital phenotyping in breeding of economically important crops
  summary_ru: Фенотипирование и генотипирование коллекций пшеницы, ячменя, кукурузы, сои и гороха, GWAS и KASP-маркеры для селекции, ускоренная селекция через дигаплоиды. 13 организаций-соисполнителей; в 2025 году на госсортоиспытание переданы три сорта ярового ячменя и два сорта мягкой пшеницы.
  summary_kk: Бидай, арпа, жүгері, соя және бұршақ коллекцияларын фенотиптеу және генотиптеу, селекцияға арналған GWAS және KASP-маркерлер, дигаплоидтар арқылы жеделдетілген селекция. 13 бірлескен орындаушы ұйым; 2025 жылы мемлекеттік сорт сынағына жаздық арпаның үш сорты және жұмсақ бидайдың екі сорты берілді.
  summary_en: Phenotyping and genotyping of wheat, barley, maize, soybean and pea collections, GWAS and KASP markers for breeding, and accelerated breeding via doubled haploids. 13 partner organisations; in 2025 three spring barley and two bread wheat cultivars were submitted to state variety trials.
- kind: program
  years: 2023–2024
  code: BR18574149
  lead: Туруспеков Е.К.
  url: https://ibbr.tilda.ws/
  title_ru: Создание высокопродуктивных сортов и линий сельскохозяйственных культур на основе инновационных биотехнологий
  title_kk: Инновациялық биотехнологиялар негізінде ауыл шаруашылығы дақылдарының жоғары өнімді сорттары мен линияларын жасау
  title_en: Development of high-yielding crop cultivars and lines based on innovative biotechnologies
  summary_ru: 'Шесть подпроектов: пшеница, устойчивая к бурой ржавчине (пирамидирование генов с маркерами), высокопродуктивный яровой ячмень, яровой рапс, рис с окрашенным перикарпом, линии томата (редактирование генома) и столовый виноград.'
  summary_kk: 'Алты кіші жоба: қоңыр татқа төзімді бидай (маркерлер арқылы гендерді пирамидалау), жоғары өнімді жаздық арпа, жаздық рапс, түрлі түсті перикарпты күріш, қызанақ линиялары (геномды редакциялау) және асханалық жүзім.'
  summary_en: 'Six subprojects: wheat resistant to leaf rust (marker-assisted gene pyramiding), high-yielding spring barley, spring rapeseed, rice with coloured pericarp, tomato lines (genome editing) and table grapes.'
