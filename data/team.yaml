# Сотрудники лаборатории. Удобнее всего редактировать через Pages CMS.
# group: lead (руководитель), staff (научные сотрудники), phd (PhD-докторанты),
#        masters (магистранты), students (студенты), alumni (выпускники)
# Порядок людей на сайте совпадает с порядком в этом списке.
# photo: путь к фото, например /images/team/turuspekov.jpg (пусто — покажутся инициалы)
# orcid: нужен для автоматического импорта публикаций из OpenAlex
members:
  - name: "Туруспеков Ерлан Кенесбекович"
    name_en: "Yerlan Turuspekov"
    group: lead
    role_ru: "Заведующий лабораторией молекулярной генетики. Академик НАН РК при Президенте РК, к.б.н., профессор"
    role_kk: "Молекулалық генетика зертханасының меңгерушісі. ҚР Президенті жанындағы ҰҒА академигі, б.ғ.к., профессор"
    role_en: "Head of the Molecular Genetics Laboratory. Academician of the National Academy of Sciences of Kazakhstan, PhD, Professor"
    bio_ru: "Окончил биологический факультет КазГУ им. С.М. Кирова (1986), кандидат наук (1992), профессор (2018). Работал в Baylor University (стипендия Фулбрайта), John Innes Centre, NIAS (Цукуба) и Montana State University. В 2008–2016 годах — заместитель генерального директора ИББР по науке. Автор более 200 работ, соавтор сортов пшеницы, ячменя и сои."
    bio_kk: "С.М. Киров атындағы ҚазМУ биология факультетін бітірген (1986), ғылым кандидаты (1992), профессор (2018). Baylor University (Фулбрайт стипендиясы), John Innes Centre, NIAS (Цукуба) және Montana State University-де жұмыс істеген. 2008–2016 жылдары ӨББИ бас директорының ғылым жөніндегі орынбасары. 200-ден астам еңбектің авторы, бидай, арпа және соя сорттарының бірлескен авторы."
    bio_en: "Graduated from the Biology Faculty of Kazakh State University (1986); PhD (1992), Professor (2018). Held research positions at Baylor University (Fulbright), the John Innes Centre, NIAS Tsukuba and Montana State University. Deputy Director General for Science at IPBB in 2008–2016. Author of more than 200 works and co-breeder of wheat, barley and soybean cultivars."
    email: ""
    orcid: "0000-0001-8590-1745"
    photo: ""

