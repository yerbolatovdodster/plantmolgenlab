# Сотрудники лаборатории. Удобнее всего редактировать через Pages CMS.
# Источник: страница лаборатории на ipbb.kz (данные примерно 2020 года) — проверьте и обновите должности и степени.
# group: lead (руководитель), staff (сотрудники), students (докторанты и студенты), alumni (выпускники)
# photo: путь к фото, например /images/team/turuspekov.jpg (можно оставить пустым — покажутся инициалы)
members:
  - name: "Туруспеков Ерлан Кенесбекович"
    name_en: "Yerlan Turuspekov"
    group: lead
    role_ru: "Заведующий лабораторией, к.б.н., профессор"
    role_kk: "Зертхана меңгерушісі, б.ғ.к., профессор"
    role_en: "Head of the laboratory, PhD, Professor"
    bio_ru: "Окончил биологический факультет КазГУ им. С.М. Кирова (1986), кандидат наук (1992), профессор (2018). Работал в Baylor University (стипендия Фулбрайта), John Innes Centre, NIAS (Цукуба) и Montana State University. В 2008–2016 годах — заместитель генерального директора ИББР по науке. С 2019 года — председатель ННС по приоритету «Науки о жизни и здоровье». Автор более 200 работ, соавтор сортов пшеницы, ячменя и сои."
    bio_kk: "С.М. Киров атындағы ҚазМУ биология факультетін бітірген (1986), ғылым кандидаты (1992), профессор (2018). Baylor University (Фулбрайт стипендиясы), John Innes Centre, NIAS (Цукуба) және Montana State University-де жұмыс істеген. 2008–2016 жылдары ӨББИ бас директорының ғылым жөніндегі орынбасары. 2019 жылдан «Өмір және денсаулық туралы ғылымдар» басымдығы бойынша ҰҒК төрағасы. 200-ден астам еңбектің авторы, бидай, арпа және соя сорттарының бірлескен авторы."
    bio_en: "Graduated from the Biology Faculty of Kazakh State University (1986); PhD (1992), Professor (2018). Held research positions at Baylor University (Fulbright), the John Innes Centre, NIAS Tsukuba and Montana State University. Deputy Director General for Science at IPBB in 2008–2016; since 2019 chairs the National Science Council for Life Sciences and Health. Author of more than 200 works and co-breeder of wheat, barley and soybean cultivars."
