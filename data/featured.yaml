items:
  - direction: genomic-breeding
    doi: 10.1371/journal.pone.0221064
    summary_ru: Ассоциативное картирование агрономических признаков у коллекции
      шестирядного ярового ячменя из США, выращенной в Казахстане.
    summary_kk: Қазақстанда өсірілген АҚШ-тың алты қатарлы жаздық арпа
      коллекциясында агрономиялық белгілерді ассоциативтік картирлеу.
  - direction: genomic-breeding
    doi: 10.1186/s12870-017-1131-2
    summary_ru: Полногеномный поиск ассоциаций для фаз развития и элементов
      урожайности яровой мягкой пшеницы, выращенной в трёх регионах Казахстана.
    summary_kk: Қазақстанның үш өңірінде өсірілген жаздық жұмсақ бидайдың даму
      кезеңдері мен өнімділік элементтеріне арналған GWAS.
  - direction: genomic-breeding
    doi: 10.1186/s12870-015-0686-z
    summary_ru: Полногеномный поиск ассоциаций устойчивости к стеблевой ржавчине у
      казахстанских линий ярового ячменя.
    summary_kk: Қазақстандық жаздық арпа желілерінің сабақ татына төзімділігін толық
      геномдық ассоциациялар арқылы іздеу.
  - direction: wild-flora
    doi: 10.1038/s41598-026-58942-9
    summary_ru: Характеристика и сравнительный анализ полных хлоропластных геномов
      двенадцати видов Allium из Казахстана.
    summary_kk: Қазақстандағы Allium-ның он екі түрінің толық хлоропласт геномдарын
      сипаттау және салыстырмалы талдау.
  - direction: wild-flora
    doi: 10.1186/s12870-026-09260-9
    image: /images/Безымянный-1-10.jpg
    summary_ru: Таксономическая оценка видов Allium из Казахстана по маркерам ITS и matK.
    summary_kk: ITS және matK маркерлері бойынша Қазақстандағы Allium түрлерін
      таксономиялық бағалау.
  - direction: wild-flora
    doi: 10.1556/034.2018.1
    summary_ru: Генетическое разнообразие и популяционная структура исчезающего
      казахстанского эндемика Oxytropis almaatensis.
    summary_kk: Жойылып бара жатқан қазақстандық эндемик Oxytropis almaatensis-тің
      генетикалық әртүрлілігі және популяциялық құрылымы.
