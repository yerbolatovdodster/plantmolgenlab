items:
  - direction: genomic-breeding
    doi: 10.3389/fpls.2025.1681398
    image: /images/fps_dissecting_barley.png
    summary_ru: Изучение генетической архитектуры устойчивости взрослых растений
      (APR) к сетчатой ​ пятнистости (SR) у группы образцов ярового двурядного
      ячменя различного происхождения с использованием полногеномного поиска
      ассоциаций (GWAS).
    summary_kk: Геномдық деңгейдегі ассоциативті талдау (GWAS) әдісін қолдана
      отырып, әртүрлі текті, екі қатарлы жаздық арпа үлгілерінің коллекциясында
      торлы дақтылыққа (net blotch) қатысты ересек өсімдіктердің төзімділігінің
      (adult plant resistance — APR) генетикалық құрылымын зерттеу
    summary_en: This study aimed to dissect the genetic architecture of APR to SR in
      a panel of diverse origins of two-row spring barley using a genome-wide
      association study (GWAS).
  - direction: genomic-breeding
    doi: 10.3390/plants15182800
    image: /images/plants-15-02800-g007 (1).png
    summary_ru: Изучение генетической архитектуры шести агрономических признаков
      (сроки цветения и созревания, высота растения, элементы урожайности) у
      коллекции образцов сои различного происхождения в условиях юго-востока
      Казахстана с использованием многосезонного полногеномного поиска
      ассоциаций (GWAS)
    summary_kk: Қазақстанның оңтүстік-шығыс жағдайында, әртүрлі текті соя үлгілері
      топтамасындағы алты агрономиялық белгінің (гүлдеу және пісу мерзімдері,
      өсімдік биіктігі және өнімділік компоненттері) генетикалық құрылымын
      бірнеше маусымды қамтитын геномдық деңгейдегі ассоциативті талдау (GWAS)
      арқылы зерттеу
    summary_en: Studying the genetic architecture of six agronomic traits (flowering
      and maturity dates, plant height, and yield components) in a collection of
      soybean accessions of diverse origin under the conditions of southeastern
      Kazakhstan, using multi-season genome-wide association studies (GWAS)
  - direction: genomic-breeding
    doi: 10.1186/s12870-015-0686-z
    summary_ru: Полногеномный поиск ассоциаций устойчивости к стеблевой ржавчине у
      казахстанских линий ярового ячменя.
    summary_kk: Қазақстандық жаздық арпа желілерінің сабақ татына төзімділігін толық
      геномдық ассоциациялар арқылы іздеу.
  - direction: wild-flora
    doi: 10.3389/fpls.2026.1860819
    image: /images/fps_iris.png
    summary_ru: Характеристика и сравнительный анализ полных хлоропластных геномов
      четырнадцати видов Iris (Iridaceae) из Казахстана.
    summary_kk: Қазақстандағы Iris-тың  (Iridaceae) он төрт түрінің толық хлоропласт
      геномдарын сипаттау және салыстырмалы талдау.
  - direction: wild-flora
    doi: 10.1186/s12870-026-09260-9
    image: /images/Безымянный-1-10.jpg
    summary_ru: Ядерная филогеномика видов Allium (Amaryllidaceae) из Казахстана
    summary_kk: "Қазақстандағы Allium (Amaryllidaceae) түрлерінің ядролы филогеномикасы "
  - direction: wild-flora
    doi: 10.1556/034.2018.1
    summary_ru: Генетическое разнообразие и популяционная структура исчезающего
      казахстанского эндемика Oxytropis almaatensis.
    summary_kk: Жойылып бара жатқан қазақстандық эндемик Oxytropis almaatensis-тің
      генетикалық әртүрлілігі және популяциялық құрылымы.
