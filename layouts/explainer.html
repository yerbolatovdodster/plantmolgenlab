{{ define "main" }}
<article class="page wrap explainer">
  {{ with .Parent }}<a class="crumb" href="{{ .RelPermalink }}">← {{ .Title }}</a>{{ end }}
  <header class="ex-head">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  <div class="prose ex-body">{{ .Content }}</div>
  {{ with .Parent }}
  <p class="page-actions">
    <a class="btn" href="{{ site.Params.appURL }}">{{ i18n "open_app" }}</a>
    <a class="btn btn-ghost" href="{{ .RelPermalink }}">← {{ .Title }}</a>
  </p>
  {{ end }}
</article>
{{ end }}
