{{- /* Ссылки вида /software/ в тексте получают префикс сайта (нужно для предпросмотра на GitHub Pages). */ -}}
{{- $u := .Destination -}}
{{- if and (hasPrefix $u "/") (not (hasPrefix $u "//")) }}{{ $u = strings.TrimPrefix "/" $u | relURL }}{{ end -}}
<a href="{{ $u | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if strings.HasPrefix $u "http" }} target="_blank" rel="noopener"{{ end }}>{{ .Text | safeHTML }}</a>
{{- /* */ -}}
