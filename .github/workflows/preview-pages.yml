# Предпросмотр сайта на GitHub Pages (бесплатно): https://<аккаунт>.github.io/<репозиторий>/
# Включите: Settings → Pages → Source: GitHub Actions.
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # пересобрать сайт после автоматического обновления публикаций
  workflow_run:
    workflows: ["Update publications"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true
      - id: pages
        uses: actions/configure-pages@v5
      - run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
